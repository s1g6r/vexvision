# Publish the scouting site (site2/) to GitHub Pages on every push to main.
name: Publish site
on:
  push:
    branches: [main]
    paths: ["site2/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p out
          cp -r site2/index.html site2/js site2/data site2/fonts site2/models site2/ort out/
          rm -rf out/data/thumbs out/data/replays/index_*.json
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
